services:
  db:
    image: postgres:16-alpine
    container_name: ferramentaria_db
    environment:
      POSTGRES_DB: ferramentaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: ferramentaria_api
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ferramentaria_web
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
